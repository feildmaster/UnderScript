name: Generated Translations
on:
  pull_request:
    paths:
      - 'lang/underscript.json'
jobs:
  check:
    name: Check
    if: github.repository == 'UCProjects/UnderScript' && github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
    - name: Reject generated file
      run: |
        echo "::error file=lang/underscript.json::This file is generated by the build. Please remove it from your pull request (git checkout origin/master -- lang/underscript.json)."
        exit 1
