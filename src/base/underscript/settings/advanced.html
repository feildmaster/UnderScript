<fieldset>
  <div class="flex-start">
    <button id="underscriptExportButton" class="btn btn-default">Export</button>
    <button id="underscriptDebugButton" class="btn btn-default"></button>
  </div>
</fieldset>
<fieldset>
  <div class="flex-start">
    <button id="underscriptImportPick" class="btn btn-default">Choose file</button>
    <input id="underscriptImportFile" type="file" accept=".json,application/json" hidden>
    <button id="underscriptImportButton" class="btn btn-default">Import</button>
  </div>
  <textarea id="underscriptImportText" rows="3" spellcheck="false" placeholder="Choose a file, or paste exported settings here"></textarea>
</fieldset>
<div id="underscriptAdvancedStatus"></div>
